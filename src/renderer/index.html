<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP notes:
      - script-src keeps 'self' (bundled) + 'unsafe-inline' for the React
        Refresh preamble used in dev; tighten to 'self' for release builds.
      - No remote origins: Barely is fully local (no backend server).
      - connect-src allows the dev HMR websocket.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss: http: https:;"
    />
    <title>Barely</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
